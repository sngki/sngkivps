name: Xray-Cloudflare-VPN

on:
  workflow_dispatch:

jobs:
  vpn-server:
    runs-on: windows-latest

    steps:
      - name: Setup VPN and Keep Alive
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          $ErrorActionPreference = "Stop"
          Set-PSDebug -Trace 1

          # 1. Download Xray
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "xray"

          # 2. Config Xray
          $config = @"
          {
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "port": 8080,
              "listen": "127.0.0.1",
              "protocol": "vless",
              "settings": {
                "clients": [{"id": "d342d11e-d224-445c-b126-23f4fc9128de"}],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "ws",
                "security": "none",
                "wsSettings": {"path": "/vpn"}
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          "@

          Set-Content -Path "xray\config.json" -Value $config

          # 3. Start Xray
          Start-Process -FilePath ".\xray\xray.exe" -ArgumentList "run -config .\xray\config.json" -NoNewWindow
          Start-Sleep -Seconds 3

          # 4. Start Cloudflare Tunnel
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

          Start-Process `
            -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel --url http://127.0.0.1:8080 --no-tls-verify" `
            -RedirectStandardError "cf.log" `
            -NoNewWindow

          Write-Host "Waiting for Cloudflare to generate URL..."
          Start-Sleep -Seconds 15

          # 5. Extract URL and Send Telegram Notification
          $logContent = Get-Content cf.log | Select-String "trycloudflare.com"
          $regex = '([a-zA-Z0-9-]+\.trycloudflare\.com)'
          $match = [regex]::Match($logContent, $regex)

          if ($match.Success) {
              $cfUrl = $match.Groups[1].Value
              Write-Host "Extracted URL: $cfUrl"

              if ($env:TELEGRAM_TOKEN -and $env:TELEGRAM_CHAT_ID) {

                  # Remove both http:// and https:// if they exist
                  $host = $cfUrl -replace '^https?://', ''

                  # Create VLESS link
                  $vlessLink = "vless://d342d11e-d224-445c-b126-23f4fc9128de@$host`:443?encryption=none&security=tls&sni=$host&type=ws&path=%2Fvpn#Xray-Cloudflare"

                  # Telegram message
                  $msg = "🚀 <b>سرور VPN جدید آماده شد!</b>`n`n🔗 <code>$vlessLink</code>"

                  # Copy button
                  $replyMarkup = @{
                      inline_keyboard = @(
                          @(
                              @{
                                  text = "📋 کپی لینک"
                                  copy_text = @{
                                      text = $vlessLink
                                  }
                              }
                          )
                      )
                  }

                  # Telegram API
                  $apiUrl = "https://api.telegram.org/bot$($env:TELEGRAM_TOKEN)/sendMessage"

                  # Request body
                  $body = @{
                      chat_id      = $env:TELEGRAM_CHAT_ID
                      text         = $msg
                      parse_mode   = "HTML"
                      reply_markup = $replyMarkup
                  }

                  # Convert entire body to JSON
                  $jsonBody = $body | ConvertTo-Json -Depth 10

                  try {
                      Invoke-RestMethod `
                        -Uri $apiUrl `
                        -Method Post `
                        -ContentType "application/json" `
                        -Body $jsonBody `
                        -ErrorAction Stop

                      Write-Host "✅ Notification sent to Telegram successfully!"
                  }
                  catch {
                      Write-Host "❌ Failed to send Telegram message: $_"
                  }
              }
          }
          else {
              Write-Host "❌ Failed to extract URL."
              Get-Content cf.log
          }

          # 6. KEEP RUNNER ALIVE
          Write-Host "Keeping Runner Alive for 6 hours..."
          Start-Sleep -Seconds 21600
