name: Xray-Cloudflare-VPN

on:
  workflow_dispatch:

jobs:
  vpn-server:
    runs-on: windows-latest

    steps:
      - name: Setup VPN and Keep Alive
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          $ErrorActionPreference = "Stop"
          # Set-PSDebug -Trace 1

          # ============================================================
          # 1. Download Xray
          # ============================================================

          Write-Host "Downloading Xray..."

          Invoke-WebRequest `
            -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" `
            -OutFile "xray.zip"

          Expand-Archive `
            -Path "xray.zip" `
            -DestinationPath "xray"

          # ============================================================
          # 2. Create Xray configuration
          # ============================================================

          Write-Host "Creating Xray configuration..."

          $config = @"
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "d342d11e-d224-445c-b126-23f4fc9128de"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "none",
                  "wsSettings": {
                    "path": "/vpn"
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          "@

          Set-Content `
            -Path "xray\config.json" `
            -Value $config `
            -Encoding UTF8

          # ============================================================
          # 3. Start Xray
          # ============================================================

          Write-Host "Starting Xray..."

          Start-Process `
            -FilePath ".\xray\xray.exe" `
            -ArgumentList "run -config .\xray\config.json" `
            -NoNewWindow

          Start-Sleep -Seconds 3

          # ============================================================
          # 4. Download and Start Cloudflare Tunnel
          # ============================================================

          Write-Host "Downloading cloudflared..."

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile "cloudflared.exe"

          Write-Host "Starting Cloudflare Tunnel..."

          Start-Process `
            -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel --url http://127.0.0.1:8080 --no-tls-verify" `
            -RedirectStandardError "cf.log" `
            -NoNewWindow

          Write-Host "Waiting for Cloudflare to generate URL..."

          Start-Sleep -Seconds 15

          # ============================================================
          # 5. Extract Cloudflare URL
          # ============================================================

          $logContent = Get-Content "cf.log" -Raw

          Write-Host "Cloudflare log:"
          Write-Host $logContent

          $regex = 'https?://([a-zA-Z0-9-]+\.trycloudflare\.com)'
          $match = [regex]::Match($logContent, $regex)

          if ($match.Success) {

              # فقط hostname را می‌گیریم
              # بدون http://
              # بدون https://
              $cfHost = $match.Groups[1].Value

              Write-Host "=============================================="
              Write-Host "Extracted Cloudflare Host:"
              Write-Host $cfHost
              Write-Host "=============================================="

              # ========================================================
              # 6. Telegram notification
              # ========================================================

              if ($env:TELEGRAM_TOKEN -and $env:TELEGRAM_CHAT_ID) {

                  # ============================================================
                  # 6. Create VLESS Link
                  # ============================================================
                  
                  # این بلوک را در workflow، به‌جای بخش‌های «Create VLESS Link» تا
                  # «Telegram Reply Markup» قرار دهید. بخش Telegram API که $body را ارسال می‌کند
                  # بدون تغییر می‌ماند.
                  
                  # بدنهٔ URL بدون نام/remark؛ پارامترهای جدید باید قبل از # اضافه شوند.
                  $vlessUrl = "vless://d342d11e-d224-445c-b126-23f4fc9128de@$cfHost`:443?encryption=none&security=tls&sni=$cfHost&type=ws&path=%2Fvpn"
                  $vlessLink = "$vlessUrl#Xray-Cloudflare"
                  
                  # نسخهٔ ECH: همان لینک، با TLS fingerprint و منبع ECH اضافه‌شده.
                  $echFingerprint = "chrome"
                  $echResolver = "cloudflare-ech.com+udp://1.1.1.1"
                  $echLink = "$vlessUrl&fp=$echFingerprint&ech=$([uri]::EscapeDataString($echResolver))#Xray-Cloudflare-ECH"
                  
                  # نسخهٔ Fragment + Fingerprint: مقادیر v2 همان preset پیش‌فرض Proxy Builder هستند.
                  $fragmentFingerprint = "unsafe"
                  $cipherSuites = "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384:TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384:TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256:TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256:TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256:TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256:TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA:TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA:TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256:TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256"
                  $fragmentMask = '{"tcp":[{"type":"fragment","settings":{"packets":"tlshello","lengths":["0","104","1"],"delays":["0"],"maxSplit":"0"}},{"type":"fragment","settings":{"packets":"1-1","lengths":["114","1"],"delays":["1"],"maxSplit":"11"}}]}'
                  $fragmentLink = "$vlessUrl&fp=$fragmentFingerprint&cs=$([uri]::EscapeDataString($cipherSuites))&fm=$([uri]::EscapeDataString($fragmentMask))#Xray-Cloudflare-Fragment"
                  
                  # برای متن HTML تلگرام، کاراکترهای URL را escape می‌کنیم.
                  $vlessLinkHtml = [System.Net.WebUtility]::HtmlEncode($vlessLink)
                  $echLinkHtml = [System.Net.WebUtility]::HtmlEncode($echLink)
                  $fragmentLinkHtml = [System.Net.WebUtility]::HtmlEncode($fragmentLink)
                  
                  $msg = @(
                      "🚀 <b>سرور جدید آماده شد</b>",
                      "",
                      "<b>لینک اصلی</b>",
                      "<code>$vlessLinkHtml</code>",
                      "",
                      "<b>نسخهٔ ECH</b>",
                      "<code>$echLinkHtml</code>",
                      "",
                      "<b>نسخهٔ Fragment + Fingerprint</b>",
                      "<code>$fragmentLinkHtml</code>"
                  ) -join "`n"
                  
                  # سه ردیف دکمهٔ کپی؛ ساخت JSON با ConvertTo-Json امن‌تر از چسباندن رشته است.
                  $originalButton = [ordered]@{
                      text = "📋 کپی لینک اصلی"
                      copy_text = [ordered]@{ text = $vlessLink }
                  }
                  $echButton = [ordered]@{
                      text = "🛡️ کپی ECH"
                      copy_text = [ordered]@{ text = $echLink }
                  }
                  $fragmentButton = [ordered]@{
                      text = "🧬 کپی Fragment"
                      copy_text = [ordered]@{ text = $fragmentLink }
                  }
                  
                  $replyMarkup = [ordered]@{
                      inline_keyboard = @(
                          @( $originalButton ),
                          @( $echButton ),
                          @( $fragmentButton )
                      )
                  }
                  $replyMarkupJson = $replyMarkup | ConvertTo-Json -Compress -Depth 10


                  # ============================================================
                  # 9. Telegram API
                  # ============================================================
                  
                  $apiUrl = "https://api.telegram.org/bot$($env:TELEGRAM_TOKEN)/sendMessage"
                  
                  $body = @{
                      chat_id      = $env:TELEGRAM_CHAT_ID
                      text         = $msg
                      parse_mode   = "HTML"
                      reply_markup = $replyMarkupJson
                  }
                  
                  
                  # ============================================================
                  # 10. Send Telegram Message
                  # ============================================================
                  
                  Write-Host "Sending Telegram notification..."
                  
                  try {
                  
                      $response = Invoke-RestMethod `
                          -Uri $apiUrl `
                          -Method Post `
                          -Body $body `
                          -ErrorAction Stop
                  
                      Write-Host "=============================================="
                      Write-Host "✅ Telegram notification sent successfully!"
                      Write-Host "=============================================="
                  
                      $response | ConvertTo-Json -Depth 10
                  }
                  catch {
                  
                      Write-Host "=============================================="
                      Write-Host "❌ Failed to send Telegram message"
                      Write-Host "=============================================="
                  
                      Write-Host $_
                  
                      if ($_.ErrorDetails.Message) {
                          Write-Host $_.ErrorDetails.Message
                      }
                  
                      Write-Host "Reply Markup JSON:"
                      Write-Host $replyMarkupJson
                  }
                                }
              else {
  
                  Write-Host "❌ TELEGRAM_TOKEN or TELEGRAM_CHAT_ID is missing."
              }
          }
          else {
  
              Write-Host "=============================================="
              Write-Host "❌ Failed to extract Cloudflare URL."
              Write-Host "=============================================="
  
              Write-Host "Cloudflare log:"
              Get-Content "cf.log"
          }

          # ============================================================
          # 7. Keep GitHub Runner alive for 6 hours
          # ============================================================

          Write-Host "=============================================="
          Write-Host "Keeping Runner Alive for 6 hours..."
          Write-Host "=============================================="

          Start-Sleep -Seconds 21600
