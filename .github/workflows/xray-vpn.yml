name: Xray-Cloudflare-VPN

on:
  workflow_dispatch:

jobs:
  vpn-server:
    runs-on: windows-latest

    steps:

      # ---------------------------------------
      # 1. Download Xray
      # ---------------------------------------
      - name: Download Xray
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" `
            -OutFile "xray.zip"

          Expand-Archive `
            -Path "xray.zip" `
            -DestinationPath "xray" `
            -Force

      # ---------------------------------------
      # 2. Configure and Start Xray
      # ---------------------------------------
      - name: Configure and Start Xray
        shell: pwsh
        run: |
          $config = @"
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "d342d11e-d224-445c-b126-23f4fc9128de"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "none",
                  "wsSettings": {
                    "path": "/vpn"
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          "@

          Set-Content `
            -Path "xray\config.json" `
            -Value $config `
            -Encoding UTF8

          Write-Host "Testing Xray configuration..."

          & ".\xray\xray.exe" run -test -config ".\xray\config.json"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Xray configuration test failed."
            exit 1
          }

          Write-Host "Starting Xray..."

          Start-Process `
            -FilePath ".\xray\xray.exe" `
            -ArgumentList "run -config .\xray\config.json" `
            -NoNewWindow

          Start-Sleep -Seconds 3

          Write-Host "Xray started."

      # ---------------------------------------
      # 3. Start Cloudflare Quick Tunnel
      # ---------------------------------------
      - name: Start Cloudflare Tunnel and Notify
        shell: pwsh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |

          Write-Host "Downloading cloudflared..."

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile "cloudflared.exe"

          Write-Host "Starting Cloudflare Quick Tunnel..."

          Start-Process `
            -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel --url http://127.0.0.1:8080 --no-tls-verify" `
            -RedirectStandardError "cf.log" `
            -NoNewWindow

          Write-Host "Waiting for Cloudflare to generate URL..."

          $cfUrl = $null

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 2

            if (Test-Path "cf.log") {

              $logContent = Get-Content "cf.log" -Raw

              Write-Host "Cloudflare log:"
              Write-Host $logContent

              $regex = 'https://([a-zA-Z0-9-]+\.trycloudflare\.com)'

              $match = [regex]::Match($logContent, $regex)

              if ($match.Success) {
                $cfUrl = $match.Groups[0].Value
                break
              }
            }
          }

          if (-not $cfUrl) {

            Write-Host "Failed to extract Cloudflare URL."

            if (Test-Path "cf.log") {
              Get-Content "cf.log"
            }

            exit 1
          }

          Write-Host "----------------------------------------"
          Write-Host "Cloudflare URL:"
          Write-Host $cfUrl
          Write-Host "----------------------------------------"

          $hostname = $cfUrl -replace '^https://', ''

          $uuid = "d342d11e-d224-445c-b126-23f4fc9128de"
          $wsPath = "/vpn"

          $vlessUri = "vless://$uuid@$hostname`:443?encryption=none&security=none&type=ws&host=$hostname&path=%2Fvpn#$([uri]::EscapeDataString('Xray-Cloudflare'))"

          Write-Host "VLESS configuration:"
          Write-Host $vlessUri

          # ---------------------------------------
          # Telegram notification
          # ---------------------------------------

          if ($env:TELEGRAM_TOKEN -and $env:TELEGRAM_CHAT_ID) {

            $msg = @"
              🚀 Xray VPN Server Ready

              🌐 Address:
              $hostname

              🔌 Port:
              443

              🆔 UUID:
              $uuid

              📡 Protocol:
              VLESS + WebSocket

              📂 WebSocket Path:
              /vpn

              🔗 VLESS URI:
              $vlessUri
              "@

            $apiUrl = "https://api.telegram.org/bot$($env:TELEGRAM_TOKEN)/sendMessage"

            $body = @{
              chat_id = $env:TELEGRAM_CHAT_ID
              text    = $msg
            }

            $jsonBody = $body | ConvertTo-Json

            Invoke-RestMethod `
              -Uri $apiUrl `
              -Method Post `
              -ContentType "application/json" `
              -Body $jsonBody

            Write-Host "Telegram notification sent."

          }
          else {

            Write-Host "Telegram Secrets are missing."

          }

      # ---------------------------------------
      # 4. Keep Runner Alive
      # ---------------------------------------
      - name: Keep Runner Alive
        shell: pwsh
        run: |

          Write-Host "========================================"
          Write-Host "Xray + Cloudflare Tunnel is running."
          Write-Host "Runner will remain alive for up to 6 hours."
          Write-Host "========================================"

          Start-Sleep -Seconds 21600
