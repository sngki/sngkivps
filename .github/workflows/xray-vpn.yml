name: Xray-Cloudflare-VPN

on:
  workflow_dispatch:

jobs:
  vpn-server:
    runs-on: windows-latest

    steps:
      - name: Setup VPN and Keep Alive
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          $ErrorActionPreference = "Stop"
          Set-PSDebug -Trace 1

          # 1. Download Xray
          Invoke-WebRequest `
            -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" `
            -OutFile "xray.zip"

          Expand-Archive `
            -Path "xray.zip" `
            -DestinationPath "xray"

          # 2. Config Xray
          $config = @"
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [{
              "port": 8080,
              "listen": "127.0.0.1",
              "protocol": "vless",
              "settings": {
                "clients": [
                  {
                    "id": "d342d11e-d224-445c-b126-23f4fc9128de"
                  }
                ],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "ws",
                "security": "none",
                "wsSettings": {
                  "path": "/vpn"
                }
              }
            }],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          "@

          Set-Content `
            -Path "xray\config.json" `
            -Value $config `
            -Encoding UTF8

          # 3. Start Xray
          Start-Process `
            -FilePath ".\xray\xray.exe" `
            -ArgumentList "run -config .\xray\config.json" `
            -NoNewWindow

          Start-Sleep -Seconds 3

          # 4. Start Cloudflare Tunnel
          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile "cloudflared.exe"

          Start-Process `
            -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel --url http://127.0.0.1:8080 --no-tls-verify" `
            -RedirectStandardError "cf.log" `
            -NoNewWindow

          Write-Host "Waiting for Cloudflare to generate URL..."
          Start-Sleep -Seconds 15

          # 5. Extract Cloudflare URL
          $logContent = Get-Content "cf.log" -Raw

          $regex = 'https?://([a-zA-Z0-9-]+\.trycloudflare\.com)'
          $match = [regex]::Match($logContent, $regex)

          if ($match.Success) {

              # Only hostname, without http:// or https://
              $cfHost = $match.Groups[1].Value

              Write-Host "Extracted Cloudflare Host: $cfHost"

              if ($env:TELEGRAM_TOKEN -and $env:TELEGRAM_CHAT_ID) {

                  # 6. Create VLESS Link
                  $vlessLink = "vless://d342d11e-d224-445c-b126-23f4fc9128de@$cfHost`:443?encryption=none&security=tls&sni=$cfHost&type=ws&path=%2Fvpn#Xray-Cloudflare"

                  Write-Host "Generated VLESS Link:"
                  Write-Host $vlessLink

                  # Encode the link for Telegram HTML
                  $vlessLinkHtml = [System.Net.WebUtility]::HtmlEncode($vlessLink)

                  # 7. Telegram Message
                  $msg = "🚀 <b>سرور VPN جدید آماده شد!</b>`n`n🔗 <code>$vlessLinkHtml</code>"

                  # 8. Copy Button
                  $replyMarkup = @{
                      inline_keyboard = @(
                          @(
                              @{
                                  text = "📋 کپی لینک"
                                  copy_text = @{
                                      text = $vlessLink
                                  }
                              }
                          )
                      )
                  }

                  # 9. Telegram API
                  $apiUrl = "https://api.telegram.org/bot$($env:TELEGRAM_TOKEN)/sendMessage"

                  $body = @{
                      chat_id      = $env:TELEGRAM_CHAT_ID
                      text         = $msg
                      parse_mode   = "HTML"
                      reply_markup = $replyMarkup
                  }

                  # Convert complete request to JSON
                  $jsonBody = $body | ConvertTo-Json -Depth 10

                  Write-Host "Sending Telegram notification..."

                  try {

                      $response = Invoke-RestMethod `
                        -Uri $apiUrl `
                        -Method Post `
                        -ContentType "application/json" `
                        -Body $jsonBody `
                        -ErrorAction Stop

                      Write-Host "✅ Notification sent to Telegram successfully!"
                      Write-Host $response

                  }
                  catch {

                      Write-Host "❌ Failed to send Telegram message:"
                      Write-Host $_
                  }
              }
              else {
                  Write-Host "❌ Telegram credentials are missing."
              }
          }
          else {

              Write-Host "❌ Failed to extract Cloudflare URL."
              Write-Host "Cloudflare log:"
              Get-Content "cf.log"
          }

          # 10. KEEP RUNNER ALIVE
          Write-Host "Keeping Runner Alive for 6 hours..."
          Start-Sleep -Seconds 21600
