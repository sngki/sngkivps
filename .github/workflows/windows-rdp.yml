name: Windows Cloud VPN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Windows Network Preparation
      # ============================================================
      - name: 1. Prepare Windows Network
        shell: powershell
        run: |

          Write-Host "=============================================="
          Write-Host "       WINDOWS NETWORK PREPARATION"
          Write-Host "=============================================="

          netsh int tcp set global autotuninglevel=normal
          netsh int tcp set global rss=enabled
          netsh int tcp set global ecncapability=disabled
          netsh int tcp set global timestamps=disabled

          Write-Host ""
          Write-Host "TCP configuration:"
          netsh int tcp show global


      # ============================================================
      # 2. Enable RDP
      # ============================================================
      - name: 2. Enable Remote Desktop
        shell: powershell
        run: |

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          Write-Host "RDP enabled."


      # ============================================================
      # 3. Create / Reset RDP User
      # ============================================================
      - name: 3. Configure RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |

          Write-Host "Configuring RDP user..."

          if ([string]::IsNullOrWhiteSpace($Env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          # Convert password to SecureString
          $SecurePassword = ConvertTo-SecureString `
            $Env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          # Check whether user already exists
          $User = Get-LocalUser `
            -Name "NvdAdmin" `
            -ErrorAction SilentlyContinue

          if ($null -eq $User) {

              Write-Host "Creating NvdAdmin..."

              New-LocalUser `
                -Name "NvdAdmin" `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "RDP Administrator"

          }
          else {

              Write-Host "NvdAdmin already exists."

              Write-Host "Resetting password..."

              Set-LocalUser `
                -Name "NvdAdmin" `
                -Password $SecurePassword
          }

          # Make sure the account is enabled
          Enable-LocalUser `
            -Name "NvdAdmin"

          # Add to Administrators group
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvdAdmin" `
            -ErrorAction SilentlyContinue

          # Verify account
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             RDP USER READY"
          Write-Host "=============================================="

          Get-LocalUser `
            -Name "NvdAdmin" |
            Select-Object Name, Enabled, PasswordNeverExpires

          Write-Host ""
          Write-Host "RDP username: NvdAdmin"
          Write-Host "Password: configured from GitHub Secret"


      # ============================================================
      # 4. Install Tailscale
      # ============================================================
      - name: 4. Install Tailscale
        shell: powershell
        run: |

          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $TS)) {

              Write-Host "Downloading Tailscale..."

              Invoke-WebRequest `
                "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
                -OutFile "C:\tailscale.msi"

              Start-Process `
                msiexec.exe `
                -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
                -Wait

              Start-Sleep -Seconds 10
          }

          Write-Host ""
          Write-Host "Tailscale version:"
          & $TS version


      # ============================================================
      # 5. Connect Tailscale + Advertise Exit Node
      # ============================================================
      - name: 5. Connect Tailscale Exit Node
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |

          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($Env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is missing."
          }

          Write-Host "Connecting to Tailscale..."

          & $TS up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-vpn-server" `
            --advertise-exit-node `
            --accept-dns=false

          Start-Sleep -Seconds 15

          Write-Host "Tailscale connected."


      # ============================================================
      # 6. Tailscale Status
      # ============================================================
      - name: 6. Tailscale Status
        shell: powershell
        run: |

          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             TAILSCALE STATUS"
          Write-Host "=============================================="

          & $TS status

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          & $TS ip -4


      # ============================================================
      # 7. Tailscale Network Diagnostics
      # ============================================================
      - name: 7. Tailscale Network Diagnostics
        shell: powershell
        run: |

          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             TAILSCALE NETCHECK"
          Write-Host "=============================================="

          & $TS netcheck

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             NETWORK CONFIG"
          Write-Host "=============================================="

          Get-NetIPConfiguration |
            Format-Table -AutoSize


      # ============================================================
      # 8. Runner Internet Test
      # ============================================================
      - name: 8. Test Runner Internet Speed
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          RUNNER INTERNET SPEED"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "Public IP:"

          try {
              Invoke-RestMethod `
                -Uri "https://api.ipify.org?format=text" `
                -TimeoutSec 10
          }
          catch {
              Write-Host "Could not detect public IP."
          }

          Write-Host ""
          Write-Host "Testing Internet download..."

          $testUrl = "https://speed.hetzner.de/100MB.bin"
          $testFile = "$env:TEMP\runner-speedtest.bin"

          try {

              $sw = [System.Diagnostics.Stopwatch]::StartNew()

              Invoke-WebRequest `
                -Uri $testUrl `
                -OutFile $testFile `
                -UseBasicParsing

              $sw.Stop()

              $bytes = (Get-Item $testFile).Length
              $seconds = $sw.Elapsed.TotalSeconds

              if ($seconds -gt 0) {

                  $mbps = ($bytes * 8) / $seconds / 1MB

                  Write-Host ""
                  Write-Host "Runner Download: $([math]::Round($mbps, 2)) Mbps" `
                    -ForegroundColor Green
              }

          }
          catch {

              Write-Host ""
              Write-Host "Download test failed." `
                -ForegroundColor Yellow

              Write-Host $_
          }

          Remove-Item `
            $testFile `
            -Force `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 9. UDP / Firewall Diagnostics
      # ============================================================
      - name: 9. UDP Diagnostics
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              UDP / FIREWALL"
          Write-Host "=============================================="

          Get-NetFirewallProfile |
            Select-Object `
              Name,
              Enabled,
              DefaultInboundAction,
              DefaultOutboundAction |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Network adapters:"

          Get-NetAdapter |
            Select-Object Name, Status, LinkSpeed, MacAddress |
            Format-Table -AutoSize


      # ============================================================
      # 10. Final VPN Information
      # ============================================================
      - name: 10. VPN Ready
        shell: powershell
        run: |

          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          $ts_ip = & $TS ip -4

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             WINDOWS CLOUD VPN READY"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Hostname : github-vpn-server" -ForegroundColor Cyan
          Write-Host "Tailscale: $ts_ip" -ForegroundColor Green
          Write-Host "Exit Node: ENABLED" -ForegroundColor Green
          Write-Host "RDP User : NvdAdmin" -ForegroundColor Yellow

          Write-Host ""
          Write-Host "Use the following command on your client:"
          Write-Host ""
          Write-Host "tailscale ping github-vpn-server"
          Write-Host ""

          Write-Host "Check whether the result says:"
          Write-Host "  DIRECT  -> preferred"
          Write-Host "  DERP    -> slower relay connection"

          Write-Host ""
          Write-Host "=================================================="


      # ============================================================
      # 11. Keep Runner Alive
      # ============================================================
      - name: 11. Keep Server Alive
        shell: powershell
        run: |

          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          for ($i = 1; $i -le 360; $i++) {

              Start-Sleep -Seconds 60

              $ts_ip = & $TS ip -4

              Write-Host `
                "[$i/360] Server running - Tailscale IP: $ts_ip"
          }
