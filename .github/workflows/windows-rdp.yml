name: Windows Cloud VPN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0


      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force

          New-LocalUser `
            -Name "NvdAdmin" `
            -Password $Password `
            -PasswordNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvdAdmin" `
            -ErrorAction SilentlyContinue


      - name: 3. Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 10


      - name: 4. Connect Tailscale as Exit Node
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-vpn-server" `
            --advertise-exit-node

          Start-Sleep -Seconds 10


      - name: 5. Show Tailscale Information
        shell: powershell
        run: |

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host "       TAILSCALE VPN SERVER READY" -ForegroundColor Cyan
          Write-Host "==============================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Hostname     : github-vpn-server" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Exit Node advertised: YES" -ForegroundColor Green
          Write-Host ""
          Write-Host "==============================================" -ForegroundColor Green


      - name: 6. Keep Server Alive
        shell: powershell
        run: |

          for ($i = 1; $i -le 360; $i++) {

            Start-Sleep -Seconds 60

            $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

            Write-Host "[$i/360] Server running - Tailscale IP: $ts_ip"
          }
